<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a1a1a; color: white; }
        #chat-box { width: 400px; height: 300px; border: 1px solid #444; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #2a2a2a; border-radius: 8px; }
        .message { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .sender { font-weight: bold; color: #00ffcc; }
        input { padding: 8px; width: 300px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; }
        button { padding: 8px 16px; border-radius: 4px; border: none; background: #00ffcc; color: #1a1a1a; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Real-Time Chat</h1>
    <div id="chat-box"></div>
    <div>
        <input type="text" id="username" placeholder="Your Name">
        <input type="text" id="msg-input" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const socket = io('http://localhost:5000');
        const chatBox = document.getElementById('chat-box');
        const room = 'general';

        // Join Room
        socket.emit('join_room', room);

        // Fetch History
        fetch(`http://localhost:5000/api/chat/history/${room}`)
            .then(res => res.json())
            .then(response => {
                response.data.forEach(msg => appendMessage(msg));
            });

        // Listen for new messages
        socket.on('receive_message', (data) => {
            appendMessage(data);
        });

        function sendMessage() {
            const sender = document.getElementById('username').value || 'Anonymous';
            const content = document.getElementById('msg-input').value;
            if (content) {
                socket.emit('send_message', { sender, content, room });
                document.getElementById('msg-input').value = '';
            }
        }

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<span class="sender">${msg.sender}:</span> ${msg.content}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
